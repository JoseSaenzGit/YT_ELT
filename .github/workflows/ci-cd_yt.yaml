name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
    build-and-push-image:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Get changed files
          id: changed-files-build
          uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
          with:
            files: |
                    dockerfile
                    requirements.txt
        - name: Set up Docker Buildx
          if: steps.changed-files-build.outputs.any_changed == 'true'
          uses: docker/setup-buildx-action@v4
        - name: Login in to DockerHub
          if: steps.changed-files-build.outputs.any_changed == 'true'
          uses: docker/login-action@v4
          with:
            username: ${{vars.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_PASSWORD}}
        - name: Build and push Docker Image
          if: steps.changed-files-build.outputs.any_changed == 'true'
          run: |
                docker buildx build --push \
                 --file dockerfile \
                 --tag ${{vars.DOCKERHUB_NAMESPACE}}/${{vars.DOCKERHUB_REPOSITORY}}:latest \
                 --tag ${{vars.DOCKERHUB_NAMESPACE}}/${{vars.DOCKERHUB_REPOSITORY}}:${{github.sha}} \
                 .

    unit-and-integration-and-e2e-test:
      runs-on: ubuntu-latest
      needs: build-and-push-image
      env:
        AIRFLOW_WWW_USER_PASSWORD: ${{secrets.AIRFLOW_WW_USER_PASSWORD}}
        AIRFLOW_WWW_USER_USERNAME: ${{secrets.AIRFLOW_WW_USER_USERNAME}}
        API_KEY: ${{secrets.API_KEY}}
        CELERY_BACKEND_NAME: ${{secrets.CELERY_BACKEND_NAME}}
        CELERY_BACKEND_PASSWORD: ${{secrets.CELERY_BACKEND_PASSWORD}}
        CELERY_BACKEND_USERNAME: ${{secrets.CELERY_BACKEND_USERNAME}}
        ELT_DATABASE_NAME: ${{secrets.ELT_DATABASE_NAME}}
        ELT_DATABASE_PASSWORD: ${{secrets.ELT_DATABASE_PASSWORD}}
        ELT_DATABASE_USERNAME: ${{secrets.ELT_DATABASE_USERNAME}}
        FERNET_KEY: ${{secrets.FERNET_KEY}}
        METADATA_DATABASE_NAME: ${{secrets.METADATA_DATABASE_NAME}}
        METADATA_DATABASE_PASSWORD: ${{secrets.METADATA_DATABASE_PASSWORD}}
        METADATA_DATABASE_USERNAME: ${{secrets.METADATA_DATABASE_USERNAME}}
        POSTGRES_USER: ${{secrets.POSTGRES_CONN_USER}}
        POSTGRES_PASSWORD: ${{secrets.POSTGRES_CONN_PASSWORD}}
        POSTGRES_CONN_HOST: ${{secrets.POSTGRES_CONN_HOST}}
        POSTGRES_CONN_PASSWORD: ${{secrets.POSTGRES_CONN_PASSWORD}}
        POSTGRES_CONN_PORT: ${{secrets.POSTGRES_CONN_PORT}}
        POSTGRES_CONN_USERNAME: ${{secrets.POSTGRES_CONN_USERNAME}}
        AIRFLOW_UID: ${{vars.AIRFLOW_UID}}
        CHANNEL_HANDLE: ${{vars.CHANNEL_HANDLE}}
        DOCKERHUB_NAMESPACE: ${{vars.DOCKERHUB_NAMESPACE}}
        DOCKERHUB_REPOSITORY: ${{vars.DOCKERHUB_REPOSITORY}}
        DOCKERHUB_USERNAME: ${{vars.DOCKERHUB_USERNAME}}
      
      steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Get changed files
          id: changed-files-tests
          uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
          with:
            files: |
                    dags/**
                    include/**
                    docker-compose.yaml
        - name: Set up Docker Compose
          if: steps.changed-files-tests.outputs.any_changed == 'true'
          run: docker compose up -d
        - name: Run Unit and Integration Test
          if: steps.changed-files-tests.outputs.any_changed == 'true'
          run: docker exec -t airflow-worker sh -c "pytest tests/ -v"
        - name: Run End to END  Dag Tests
          if: steps.changed-files-tests.outputs.any_changed == 'true'
          run: |
                DAG_NAMES=("produce_json" "update_db" "data_quality")
                for DAG in "${DAG_NAMES[@]}"; do
                  docker exec -t airflow-worker sh -c "airflow dags test $DAG"
                done
        - name: Diagnostico si falla
          if: failure()
          run: |
                docker inspect airflow-worker --format 'StartedAt={{.State.StartedAt}} FinishedAt={{.State.FinishedAt}} Restarts={{.RestartCount}}'
                echo "---- LOG POSTGRES ----"
                docker logs postgres --tail 80 2>&1 | grep -i -E "fatal|detail|error" || echo "sin errores en postgres"
                echo "---- LOG WORKER ----"
                docker logs airflow-worker 2>&1 | head -80
                echo "---- FORMATO DE CREDENCIALES (solo si/no) ----"
                for v in CELERY_BACKEND_USERNAME CELERY_BACKEND_PASSWORD METADATA_DATABASE_USERNAME METADATA_DATABASE_PASSWORD ELT_DATABASE_USERNAME ELT_DATABASE_PASSWORD POSTGRES_CONN_USERNAME POSTGRES_CONN_PASSWORD; do
                  val="${!v}"
                  if [[ "$val" =~ [[:space:]] ]]; then ws=SI; else ws=no; fi
                  if [[ "$val" =~ [^A-Za-z0-9_] ]]; then sp=SI; else sp=no; fi
                  echo "$v espacios=$ws especiales=$sp"
                done
        - name: Tear down Docker Compose
          if: steps.changed-files-tests.outputs.any_changed == 'true'
          run: docker compose down
             